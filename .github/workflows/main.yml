name: Go

on:
  push:
    branches: [ v0 ]
  pull_request:
    branches: [ v0 ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - uses: actions/setup-go@v3
      with:
        go-version: 1.19

    - name: 'Build sample'
      run: |
        cd examples/simple/
        go build -v

    - name: 'Run tests'
      run: |
        go env && go test -v ./...
