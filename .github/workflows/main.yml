---
name: main

on:
  push:
    branches: [ v2 ]
    tags: ['*']
  pull_request:
    branches: [ v2 ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: 'Run tests'
      run: |
        go env && go test -v ./...

    - name: 'Build sample'
      run: |
        cd examples/v2/simple/
        go build -v
